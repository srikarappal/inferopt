[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferopt"
version = "0.1.0"
description = "Search serving configurations for an LLM and return a measured Pareto frontier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

# vLLM and torch are DELIBERATELY not dependencies. They are large, CUDA-version
# specific, and usually already provisioned on a GPU host; resolving them here
# would be more likely to break a working environment than to fix a broken one.
# setup.sh checks for them and says what to install. Same reasoning as evalplus,
# which is installed into an isolated tree because it drags in openai, anthropic
# and google-generativeai for generation backends this project never uses.
dependencies = [
    "pydantic>=2",
    "httpx",
    "huggingface-hub",
    "requests",
    "platformdirs",
]

[project.optional-dependencies]
# Stage 1.2, NVIDIA's config predictor. This SHOULD be a plain dependency and
# cannot be one, for a reason that is upstream's: aiconfigurator 0.11 declares
# numpy~=1.26.4 while inferopt runs beside vLLM on numpy 2.x.
#
# The pin is false, not merely inconvenient. Across all five entry points,
# cli_support, cli_generate, cli_default, cli_recommend and cli_exp, numpy
# 1.26.4 and 2.3.5 produce byte-identical output: same support verdict, same
# frontier, request_rate 107.287, ttft 187.127, tpot 18.023. The software runs
# fine on numpy 2; only its metadata says otherwise.
#
# pip offers no way for a dependent to relax a dependency's pin. Verified: a
# plain install downgrades numpy, `--constraint numpy>=2.3.5` errors, and
# pinning the version errors. So until the pin is relaxed upstream this is an
# extra, and setup.sh installs it with --no-deps for the serving environment.
# When it is relaxed, this moves into `dependencies` and setup.sh drops it.
predict = ["aiconfigurator>=0.11"]
plots = ["matplotlib>=3.7", "seaborn"]
data = ["datasets"]
dev = ["networkx", "python-docx", "matplotlib>=3.7", "seaborn"]

[project.scripts]
inferopt = "inferopt.run:main"
inferopt-screen = "inferopt.pb_screen:main"
inferopt-yolo = "inferopt.yolo_run:main"
inferopt-compare = "inferopt.compare:main"
inferopt-eval = "inferopt.eval_repro:main"
inferopt-fetch-data = "inferopt.fetch_data:main"
inferopt-selftest = "inferopt.selftest:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["inferopt"]

[tool.setuptools.package-data]
# The shipped DAG travels with the wheel; runs/, artifacts/ and data/ do not --
# they are workspace data and resolve through inferopt._paths.
inferopt = ["dag/*.json"]
